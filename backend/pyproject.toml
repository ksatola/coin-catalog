[project]
name = "coin-catalog"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
authors = [
    { name = "Krzysztof Satola", email = "2679192+ksatola@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy==2.0.52",
]

[project.scripts]
coin-catalog = "coin_catalog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
